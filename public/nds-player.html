<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NDS Player</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // This page is loaded in an iframe by NdsPlayer.tsx -- EmulatorJS's own
      // docs state it can't run directly inside a React/SPA page, only in an
      // iframe. The parent passes the ROM/BIOS as blob: URLs (created from
      // locally-picked File objects, never uploaded anywhere) via the query
      // string, and drives input by calling into this window's EJS_emulator
      // instance directly (same-origin, so that's reachable from the parent).
      var params = new URLSearchParams(location.search);

      window.EJS_player = "#game";
      window.EJS_core = "nds";
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_gameUrl = params.get("rom");
      window.EJS_biosUrl = params.get("bios9");
      window.EJS_gameName = params.get("name") || "game";
      window.EJS_startOnLoaded = true;
      window.EJS_backgroundColor = "#000000";
      // We drive input programmatically from the parent (mapping our phone
      // remote's own button stream) -- hide EmulatorJS's own on-screen touch
      // gamepad so it doesn't compete with that for the same screen space.
      window.EJS_VirtualGamepadSettings = false;
      window.EJS_Buttons = {
        playPause: false,
        restart: false,
        mute: false,
        settings: false,
        fullscreen: false,
        saveState: true,
        loadState: true,
        screenRecord: false,
        gamepad: false,
        cheat: false,
        volume: false,
        saveSavFiles: false,
        loadSavFiles: false,
        quickSave: false,
        quickLoad: false,
        screenshot: false,
        cacheManager: false,
      };
      window.EJS_ready = function () {
        window.parent.postMessage({ type: "nds-ready" }, "*");
      };
      window.EJS_onGameStart = function () {
        window.parent.postMessage({ type: "nds-started" }, "*");
      };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
  </body>
</html>
